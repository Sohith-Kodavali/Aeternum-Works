<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="AI Course preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#c7d2fe" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <rect width="800" height="500" fill="url(#glow2)"/>

  <!-- badge pill -->
  <g transform="translate(400 108)">
    <rect x="-150" y="-18" width="300" height="36" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="-124" cy="0" r="4" fill="#4f46e5"/>
    <text x="-108" y="5" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#4b5563" letter-spacing="0.02em">Department of CSE · IIITDM Kurnool</text>
  </g>

  <!-- AI mark -->
  <g transform="translate(400 210)">
    <rect x="-42" y="-42" width="84" height="84" rx="20" fill="url(#mark)"/>
    <text x="0" y="14" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">AI</text>
  </g>

  <!-- Title -->
  <text x="400" y="330" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="700" fill="url(#title)" text-anchor="middle" letter-spacing="-0.02em">Artificial Intelligence</text>

  <!-- Sub -->
  <text x="400" y="368" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#6366f1" text-anchor="middle" letter-spacing="0.08em">AD203 · AUTUMN 2026</text>

  <!-- CTA row -->
  <g transform="translate(400 424)">
    <rect x="-172" y="-22" width="164" height="44" rx="22" fill="#4f46e5"/>
    <text x="-90" y="6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Course Syllabus</text>
    <rect x="8" y="-22" width="164" height="44" rx="22" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="90" y="6" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Weekly Schedule</text>
  </g>
</svg>
